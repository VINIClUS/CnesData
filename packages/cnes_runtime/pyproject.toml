[project]
name = "cnes-runtime"
version = "0.1.0"
description = "Configuração e composição de runtime"
requires-python = ">=3.13"
dependencies = [
    "cnes-contracts",
    "cnes-control-plane",
    "cnes-data",
    "cnes-governance",
    "boto3>=1.43",
    "python-dotenv>=1.2",
    "pydantic>=2.10",
    "botocore>=1.43",
]

[tool.uv.sources]
cnes-contracts = { workspace = true }
cnes-control-plane = { workspace = true }
cnes-data = { workspace = true }
cnes-governance = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "artifacts",
    "aws",
    "config.py",
    "profiles.py",
    "settings_types.py",
]
sources = { "" = "cnes_runtime" }
dev-mode-dirs = [".."]
