[project]
name = "cnes-runtime"
version = "0.1.0"
description = "Configuração e composição de runtime"
requires-python = ">=3.13"
dependencies = [
    "cnes-domain",
    "cnes-data",
    "cnes-governance",
    "cnes-control-plane",
    "boto3>=1.43",
    "python-dotenv>=1.2",
]

[tool.uv.sources]
cnes-domain = { workspace = true }
cnes-data = { workspace = true }
cnes-governance = { workspace = true }
cnes-control-plane = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "aws", "config.py"]
sources = { "" = "cnes_runtime" }
dev-mode-dirs = [".."]
