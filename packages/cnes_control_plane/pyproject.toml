[project]
name = "cnes-control-plane"
version = "0.1.0"
description = "Controle, billing transacional e execução"
requires-python = ">=3.13"
dependencies = [
    "cnes-contracts",
    "cnes-domain",
    "cnes-data",
    "cnes-observability",
    "boto3>=1.43",
    "pydantic>=2.10",
    "stripe>=15.6,<16",
]

[tool.uv.sources]
cnes-contracts = { workspace = true }
cnes-domain = { workspace = true }
cnes-data = { workspace = true }
cnes-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "billing", "execution", "persistence"]
sources = { "" = "cnes_control_plane" }
dev-mode-dirs = [".."]
