[project]
name = "cnes-observability"
version = "0.1.0"
description = "Logs, tracing e contadores"
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "json_logging.py",
    "query_count.py",
    "telemetry.py",
    "tracer.py",
]
sources = { "" = "cnes_observability" }
dev-mode-dirs = [".."]
