[project]
name = "cnes-domain"
version = "0.1.0"
description = "Domain layer — ports, contracts, models, processing (zero I/O)"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.20",
    "pandera>=0.30",
    "holidays>=0.46",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "competencia.py",
    "processing",
    "validation",
    "validators.py",
]
sources = { "" = "cnes_domain" }
dev-mode-dirs = [".."]
