[project]
name = "cnes-domain"
version = "0.1.0"
description = "Domain layer — ports, contracts, models, processing (zero I/O)"
requires-python = ">=3.13"
dependencies = [
    "cnes-contracts",
    "polars>=1.20",
    "pandera>=0.30",
    "pydantic>=2.10",
    "holidays>=0.46",
]

[tool.uv.sources]
cnes-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "billing", "competencia.py", "config.py", "control_plane", "orchestration", "outbox_dispatcher.py", "pipeline", "ports", "processing", "profiles.py", "tenant.py", "validation", "validators.py"]
sources = { "" = "cnes_domain" }
dev-mode-dirs = [".."]
