[project]
name = "cnes-governance"
version = "0.1.0"
description = "Sinks de auditoria operacional"
requires-python = ">=3.13"
dependencies = [
    "cnes-contracts",
    "cnes-data",
    "boto3>=1.43",
    "botocore>=1.43",
]

[tool.uv.sources]
cnes-contracts = { workspace = true }
cnes-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "local_sink.py",
    "s3_object_lock_sink.py",
]
sources = { "" = "cnes_governance" }
dev-mode-dirs = [".."]
