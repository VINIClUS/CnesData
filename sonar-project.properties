sonar.projectKey=VINIClUS_CnesData
sonar.organization=viniclus

sonar.sources=packages,apps,scripts
sonar.tests=packages/cnes_contracts/tests,packages/cnes_domain/tests,packages/cnes_infra/tests,apps/central_api/tests,apps/data_processor/tests,apps/cnes_db_migrator/tests,apps/web_dashboard/tests,tests
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/*_test.go,**/*.test.ts,**/*.test.tsx,\
  packages/*/tests/**,apps/*/tests/**,tests/**

sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage-packages.xml,coverage-apps.xml
sonar.go.coverage.reportPaths=apps/dump_agent_go/coverage.out
sonar.javascript.lcov.reportPaths=apps/web_dashboard/coverage/lcov.info

sonar.exclusions=\
  .worktrees/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  packages/cnes_infra/src/cnes_infra/alembic/versions/**,\
  apps/web_dashboard/src/api/generated.ts,\
  apps/web_dashboard/src/routeTree.gen.ts,\
  apps/dump_agent_go/internal/apiclient/generated.go,\
  fb_64.zip,\
  spike_fb_driver/**,\
  docs/**,\
  deploy/**,\
  charts/**

sonar.coverage.exclusions=tests/**,**/tests/**,scripts/**,**/alembic/versions/**

# Baseline de seguranca/reliability: falsos positivos e restricoes externas
# documentadas, escopados por regra + caminho. Revisar junto de docs/architecture.md.
# Nunca alargar para diretorio inteiro sem escopo de regra.
sonar.issue.ignore.multicriteria=e1a,e1b,e1c,e1d,e2,e3,e4,e5,e6,e7,e11a,e11b,e11c

# e1: CLIs de ops em scripts/** - taint source e o argv do operador, nao entrada remota.
sonar.issue.ignore.multicriteria.e1a.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1a.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e1b.ruleKey=pythonsecurity:S8706
sonar.issue.ignore.multicriteria.e1b.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e1c.ruleKey=pythonsecurity:S8703
sonar.issue.ignore.multicriteria.e1c.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e1d.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e1d.resourceKey=scripts/**

# e2: mesmo caso do e1 - entrypoint CLI de export, nao servico exposto.
sonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e2.resourceKey=packages/cnes_contracts/src/cnes_contracts/export.py

# e3: random() so gera dados sinteticos de fixture; espelha o ignore ruff S311.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/seed_firebird_fixture.py

# e4: jitter de retry; espelha gosec excludes G404 em .golangci.yml.
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S2245
sonar.issue.ignore.multicriteria.e4.resourceKey=apps/dump_agent_go/**

# e5: DATASUS so publica dados via FTP; ja documentado com noqa: S321.
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=packages/cnes_infra/src/cnes_infra/ingestion/datasus_cnes_transport.py

# e6: falso positivo de enum narrowing (is SnapshotMode.DELTA), triado em a26844e.
sonar.issue.ignore.multicriteria.e6.ruleKey=pythonbugs:S2583
sonar.issue.ignore.multicriteria.e6.resourceKey=apps/central_api/src/central_api/services/raw_ingestion.py

# e7: --no-build na chamada alembic quebrou o CI e foi revertido em 83a4b03.
sonar.issue.ignore.multicriteria.e7.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.e7.resourceKey=scripts/ci_python_gate.sh

# e11: linha "uv pip install --system /wheels/*.whl" nao pode usar --no-build nem
# --only-binary :all: porque datasus-dbc 0.1.3 (dep transitiva de cnes_infra[national])
# nao publica wheel cp313 - build quebra sem sdist. Restricao externa documentada,
# revisar quando upstream publicar wheel py313 ou a dep for substituida.
# ATENCAO: escopo por regra+arquivo tambem cobre a linha de "pip install uv" no
# mesmo arquivo, ja corrigida por --only-binary :all: uv==0.9.26 - uma regressao
# ali nao seria pega por este gate.
sonar.issue.ignore.multicriteria.e11a.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e11a.resourceKey=apps/central_api/Dockerfile
sonar.issue.ignore.multicriteria.e11b.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e11b.resourceKey=apps/data_processor/Dockerfile
sonar.issue.ignore.multicriteria.e11c.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e11c.resourceKey=apps/cnes_db_migrator/Dockerfile
