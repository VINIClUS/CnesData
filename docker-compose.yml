services:
  postgres:
    image: postgres:16-alpine
    container_name: cnesdata_pg_test
    environment:
      POSTGRES_USER: cnesdata
      POSTGRES_PASSWORD: cnesdata_test
      POSTGRES_DB: cnesdata_test
    ports:
    - 5433:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U cnesdata -d cnesdata_test
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - pgdata_test:/var/lib/postgresql/data
    profiles:
    - dev
  pg-seed:
    image: python:3.13-slim
    container_name: cnesdata_pg_seed
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      PG_TEST_URL: postgresql+psycopg://cnesdata:cnesdata_test@postgres:5432/cnesdata_test
    volumes:
    - ./packages/cnes_infra/tests/fixtures:/app/fixtures
    - ./packages:/app/packages
    - ./pyproject.toml:/app/pyproject.toml
    working_dir: /app
    command: "sh -c \"\n  pip install psycopg[binary] sqlalchemy faker --quiet &&\n\
      \  pip install --no-deps ./packages/cnes_domain ./packages/cnes_infra --quiet\
      \ &&\n  python fixtures/seed_postgres.py\n\"\n"
    profiles:
    - dev
  # minio/minio was archived and pulled from Docker Hub; AIStor is the
  # successor. Free tier requires a mounted license file (never committed —
  # see .gitignore) — an unlicensed server starts and reports healthy on
  # /minio/health/live while denying every S3 operation, so the healthcheck
  # below exercises mc instead of that endpoint. Get a license at
  # https://min.io/pricing (Free tier) and place it at ./minio.license.
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3
    container_name: cnesdata_minio
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
    - 9000:9000
    - 9001:9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
    - minio_data:/data
    - ./minio.license:/minio.license:ro
    profiles:
    - dev
  minio-init:
    image: quay.io/minio/aistor/mc:latest@sha256:23511e340cbabf07e6a8b53f9c434975708f22f3c047d6beeddc17bf1a5aed88
    container_name: cnesdata_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: "/bin/sh -c \"\n  mc alias set local http://minio:9000 minioadmin\
      \ minioadmin &&\n  mc mb --ignore-existing local/cnesdata-landing &&\n  echo\
      \ 'bucket cnesdata-landing ready'\n\"\n"
    profiles:
    - dev
  migrator:
    build:
      context: .
      dockerfile: apps/cnes_db_migrator/Dockerfile
    container_name: cnesdata_migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@postgres:5432/cnesdata_test
    profiles:
    - dev
  central-api:
    build:
      context: .
      dockerfile: apps/central_api/Dockerfile
    container_name: cnesdata_central_api
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
    - 8000:8000
    environment:
      DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@postgres:5432/cnesdata_test
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET: cnesdata-landing
      S3_ADDRESSING_STYLE: path
      API_HOST: 0.0.0.0
      API_PORT: '8000'
      # Stack local sem Caddy: agentes falam HTTP puro, sem certificado cliente.
      AGENT_MTLS_REQUIRED: 'false'
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
    - dev
  data-processor:
    build:
      context: .
      dockerfile: apps/data_processor/Dockerfile
    container_name: cnesdata_data_processor
    depends_on:
      central-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@postgres:5432/cnesdata_test
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: cnesdata-landing
      S3_ADDRESSING_STYLE: path
      PROCESSOR_ID: docker-processor-01
      PROCESSOR_POLL_INTERVAL: '5.0'
    profiles:
    - dev
    restart: on-failure
  postgres_perf:
    image: postgres:16-alpine
    container_name: cnesdata_pg_perf
    environment:
      POSTGRES_USER: cnesdata
      POSTGRES_PASSWORD: cnesdata_perf
      POSTGRES_DB: cnesdata_perf
    ports:
    - 5434:5432
    command:
    - postgres
    - -c
    - shared_buffers=512MB
    - -c
    - max_connections=200
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U cnesdata -d cnesdata_perf
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
    - pgdata_perf:/var/lib/postgresql/data
    profiles:
    - perf
  firebird_perf:
    image: jacobalberty/firebird:v4.0.2
    container_name: cnesdata_fb_perf
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: CNES.FDB
    ports:
    - 3051:3050
    volumes:
    - fbdata_perf:/firebird/data
    profiles:
    - perf
  firebird-shadow:
    image: jacobalberty/firebird:2.5-ss
    container_name: cnesdata_fb_shadow
    environment:
      FIREBIRD_DATABASE: shadow.fdb
      ISC_PASSWORD: masterkey
    volumes:
    - ./docs/fixtures/shadow-seed:/seed:ro
    - fb_shadow_data:/firebird/data
    ports:
    - "3052:3050"
    profiles:
    - shadow
  # Not AIStor: this runs unattended on schedule/push (shadow-e2e.yml) with
  # no license file plumbed through CI, and an unlicensed AIStor denies every
  # S3 operation (see the `minio` service comment above). LocalStack needs no
  # license for its free/community S3 support, same image already pinned for
  # the aws-test profile.
  minio-shadow:
    image: localstack/localstack:4.11.1@sha256:3071c9c72a1e9dbc23ad33540617ad7825ffeba80a8f421eff798b97850f9de5
    container_name: cnesdata_minio_shadow
    environment:
      AWS_DEFAULT_REGION: us-east-1
      SERVICES: s3
      S3_SKIP_SIGNATURE_VALIDATION: '0'
    ports:
    - "9100:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      retries: 20
    profiles:
    - shadow
  web_dashboard:
    image: oven/bun:1.3-alpine
    container_name: cnesdata_web_dashboard
    working_dir: /app
    volumes:
    - ./apps/web_dashboard:/app
    - ./docs/contracts:/contracts:ro
    ports:
    - 5173:5173
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_OIDC_AUTHORITY: http://localhost:8080/realms/cnesdata
      VITE_OIDC_CLIENT_ID: cnesdata-dashboard
      VITE_OIDC_REDIRECT_URI: http://localhost:5173/auth/callback
    profiles:
    - dev
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: cnesdata_keycloak
    command: ["start-dev", "--import-realm"]
    ports:
    - 8080:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
    - ./docker-compose.keycloak:/opt/keycloak/data/import:ro
    profiles:
    - dev
  dynamodb-local:
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
    - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    profiles:
    - aws-test
  # Pin is structural, not incidental: localstack/localstack:latest requires
  # LOCALSTACK_AUTH_TOKEN since the Community edition ended 2026-03-23, and the
  # Hobby plan prohibits commercial use. Bumping this digest is a licensing
  # decision, not a routine update.
  localstack:
    image: localstack/localstack:4.11.1@sha256:3071c9c72a1e9dbc23ad33540617ad7825ffeba80a8f421eff798b97850f9de5
    environment:
      AWS_DEFAULT_REGION: us-east-1
      SERVICES: s3
      # Off by default upstream: an unsigned/expired presigned URL would be
      # accepted silently, masking real signing bugs in CI.
      S3_SKIP_SIGNATURE_VALIDATION: '0'
    ports:
    - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    profiles:
    - aws-test
  central-api-local:
    build:
      context: .
      dockerfile: apps/central_api/Dockerfile
    container_name: cnesdata_central_api_local
    ports:
    - 8000:8000
    environment:
      PROFILE: local
      TENANT_ID: '354130'
      DATA_DIR: /data
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # cnes_infra.config exige DB_URL no import do módulo; nunca conectado no profile local.
      DB_URL: postgresql+psycopg://unused:unused@unused/unused
    volumes:
    - local_data:/data
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')"
      interval: 15s
      timeout: 15s
      retries: 5
      # Cold-start do interpretador Python observado em até 16s sob carga/hardware
      # modesto; data-processor-local bloqueia indefinidamente em service_healthy
      # se o primeiro check falhar por timeout antes disso.
      start_period: 60s
    profiles:
    - local
  data-processor-local:
    build:
      context: .
      dockerfile: apps/data_processor/Dockerfile
    container_name: cnesdata_data_processor_local
    depends_on:
      central-api-local:
        condition: service_healthy
    environment:
      PROFILE: local
      TENANT_ID: '354130'
      DATA_DIR: /data
      PROCESSOR_POLL_INTERVAL: '5.0'
      DB_URL: postgresql+psycopg://unused:unused@unused/unused
    volumes:
    - local_data:/data
    profiles:
    - local
    restart: on-failure
  web-dashboard-local:
    image: oven/bun:1.3-alpine
    container_name: cnesdata_web_dashboard_local
    working_dir: /app
    volumes:
    - ./apps/web_dashboard:/app
    - ./docs/contracts:/contracts:ro
    ports:
    - 5173:5173
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_AUTH_MODE: local
    profiles:
    - local
volumes:
  local_data: null
  pgdata_test: null
  minio_data: null
  pgdata_perf: null
  fbdata_perf: null
  fb_shadow_data: null
