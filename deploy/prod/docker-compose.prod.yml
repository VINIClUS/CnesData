# Production stack for the `main` branch, on the Hostinger VPS
# (103.199.184.166), sharing the host with the `develop` staging stack in
# deploy/dev/. Only `caddy` is exposed on 80/443; it also proxies
# dev.cnesdata.vinisantana.com via the shared cnesdata_edge network.
#
# Images are pulled from GHCR (built by .github/workflows/deploy-main.yml),
# never built on the VPS. IMAGE_TAG is written by deploy.sh before each run.

name: cnesdata

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      echo bucket ready"

  migrator:
    image: ghcr.io/viniclus/cnesdata/cnes_db_migrator:${IMAGE_TAG}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}

  central-api:
    image: ghcr.io/viniclus/cnesdata/central_api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_BUCKET: ${MINIO_BUCKET}
      AUTH_REQUIRED: ${AUTH_REQUIRED}
      DASHBOARD_OIDC_ISSUER: ${DASHBOARD_OIDC_ISSUER}
      DASHBOARD_OIDC_AUDIENCE: ${DASHBOARD_OIDC_AUDIENCE}
      AUTH_CA_CERT_PATH: /secrets/ca.crt
      AUTH_CA_KEY_PATH: /secrets/ca.key
      AUTH_DEVICE_VERIFICATION_URI: ${AUTH_DEVICE_VERIFICATION_URI}
      COD_MUN_IBGE: ${COD_MUN_IBGE}
      ID_MUNICIPIO_IBGE7: ${ID_MUNICIPIO_IBGE7}
      CNPJ_MANTENEDORA: ${CNPJ_MANTENEDORA}
      COMPETENCIA_ANO: ${COMPETENCIA_ANO}
      COMPETENCIA_MES: ${COMPETENCIA_MES}
      TZ: America/Sao_Paulo
    volumes:
      - ./secrets/ca.crt:/secrets/ca.crt:ro
      - ./secrets/ca.key:/secrets/ca.key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    working_dir: /

  data-processor:
    image: ghcr.io/viniclus/cnesdata/data_processor:${IMAGE_TAG}
    restart: on-failure
    depends_on:
      central-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_BUCKET: ${MINIO_BUCKET}
      PROCESSOR_ID: ${PROCESSOR_ID}
      PROCESSOR_POLL_INTERVAL: ${PROCESSOR_POLL_INTERVAL}
      PROCESSOR_IDLE_POLL_INTERVAL: ${PROCESSOR_IDLE_POLL_INTERVAL}
      COD_MUN_IBGE: ${COD_MUN_IBGE}
      ID_MUNICIPIO_IBGE7: ${ID_MUNICIPIO_IBGE7}
      CNPJ_MANTENEDORA: ${CNPJ_MANTENEDORA}
      COMPETENCIA_ANO: ${COMPETENCIA_ANO}
      COMPETENCIA_MES: ${COMPETENCIA_MES}
      TZ: America/Sao_Paulo
    working_dir: /

  web-dashboard:
    image: ghcr.io/viniclus/cnesdata/web_dashboard:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      central-api:
        condition: service_healthy
    environment:
      UPSTREAM_API: central-api:8000
      OIDC_AUTHORITY: ${DASHBOARD_OIDC_ISSUER}
      TZ: America/Sao_Paulo

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${PUBLIC_DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      TZ: America/Sao_Paulo
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data/h2

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web-dashboard
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, cnesdata_edge]

volumes:
  pgdata:
  minio_data:
  keycloak_data:
  caddy_data:
  caddy_config:

networks:
  cnesdata_edge:
    external: true
