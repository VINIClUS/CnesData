name: phase-a-prepare

"on":
  workflow_dispatch:
    inputs:
      reference:
        description: JSON da referência do candidato R2 (repository, run_id, run_attempt, artifact_id, artifact_digest)
        required: true
        type: string
      creator:
        description: JSON do pin do criador do candidato (workflow_path, workflow_sha)
        required: true
        type: string
      baseline:
        description: JSON com os ARNs ativo e retidos da task definition anterior
        required: true
        type: string
      source_sha:
        description: SHA completo do candidato promovido
        required: true
        type: string
      canary_trusted_principal_arn:
        description: ARN do principal confiável do canary
        required: true
        type: string

permissions: {}

concurrency:
  group: phase-a-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
      actions: read
      checks: read
    env:
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.26"
      - name: Instalar dependências do lock
        run: uv sync --locked --all-packages
      - name: Gravar os inputs em arquivos locais
        env:
          REFERENCE: ${{ inputs.reference }}
          CREATOR: ${{ inputs.creator }}
          BASELINE: ${{ inputs.baseline }}
          ACCOUNT_ID: ${{ vars.PRODUCTION_AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          mkdir -p "$RUNNER_TEMP/phase-a"
          printf '%s' "$REFERENCE" > "$RUNNER_TEMP/phase-a/reference.json"
          printf '%s' "$CREATOR" > "$RUNNER_TEMP/phase-a/creator.json"
          printf '%s' "$BASELINE" > "$RUNNER_TEMP/phase-a/baseline.json"
      - name: Obter a credencial AWS pelo OIDC do job
        env:
          ACCOUNT_ID: ${{ vars.PRODUCTION_AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > "$RUNNER_TEMP/oidc-token"
          {
            echo "AWS_ROLE_ARN=arn:aws:iam::${ACCOUNT_ID}:role/cnesdata-prod-ecr-promotion"
            echo "AWS_WEB_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/oidc-token"
          } >> "$GITHUB_ENV"
      - name: Promover a imagem ao ECR e montar os inputs da Phase A
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCOUNT_ID: ${{ vars.PRODUCTION_AWS_ACCOUNT_ID }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANARY_PRINCIPAL: ${{ inputs.canary_trusted_principal_arn }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phase-a"
          uv run --no-sync python -m scripts.promotion.phase_a_cli promote-ecr \
            --reference "$out/reference.json" --creator "$out/creator.json" \
            --account-id "$ACCOUNT_ID" --region "$AWS_REGION" --output "$out/promotion.json"
          uv run --no-sync python -m scripts.promotion.phase_a_cli phase-inputs \
            --promotion "$out/promotion.json" \
            --baseline "$out/baseline.json" --account-id "$ACCOUNT_ID" --region "$AWS_REGION" \
            --source-sha "$SOURCE_SHA" --canary-trusted-principal-arn "$CANARY_PRINCIPAL" \
            --output "$out/phase-inputs.json"
      - name: Preparar os objetos privados e o artefato público
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          uv run --no-sync python -m scripts.promotion.phase_a_cli stage-private \
            --directory "$RUNNER_TEMP/phase-a" --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
      - name: Obter a credencial do role de escrita pelo OIDC do job
        env:
          ACCOUNT_ID: ${{ vars.PRODUCTION_AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > "$RUNNER_TEMP/oidc-token-writer"
          {
            echo "AWS_ROLE_ARN=arn:aws:iam::${ACCOUNT_ID}:role/cnesdata-prod-phase-inputs-writer"
            echo "AWS_WEB_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/oidc-token-writer"
          } >> "$GITHUB_ENV"
      - name: Gravar os três objetos privados com SSE-KMS e If-None-Match
        env:
          ACCOUNT_ID: ${{ vars.PRODUCTION_AWS_ACCOUNT_ID }}
          EVIDENCE_BUCKET: ${{ vars.PRODUCTION_EVIDENCE_BUCKET }}
          EVIDENCE_PREFIX: ${{ vars.PRODUCTION_EVIDENCE_PREFIX }}
          EVIDENCE_KMS_KEY_ARN: ${{ vars.PRODUCTION_EVIDENCE_KMS_KEY_ARN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          uv run --no-sync python -m scripts.promotion.phase_a_cli upload-private \
            --directory "$RUNNER_TEMP/phase-a" --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --account-id "$ACCOUNT_ID" \
            --bucket "$EVIDENCE_BUCKET" --prefix "$EVIDENCE_PREFIX" \
            --kms-key-arn "$EVIDENCE_KMS_KEY_ARN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-a-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase-a/phase-a-public.json
          if-no-files-found: error
          retention-days: 30
