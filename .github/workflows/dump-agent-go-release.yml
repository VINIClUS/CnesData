name: dump-agent-go-release

on:
  push:
    tags: ['dumpagent-go-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao para dry-run (ex.: v0.1.0-rc.1). Nao publica release.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dump-agent-go-release
  cancel-in-progress: false

env:
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ver="$INPUT_VERSION"
            dry=true
          else
            ver="${REF_NAME#dumpagent-go-}"
            dry=false
          fi
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          pre='^v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta|alpha)\.?[0-9]+$'
          if [[ "$ver" =~ $stable ]]; then
            ch=stable
          elif [[ "$ver" =~ $pre ]]; then
            ch=rc
          else
            echo "version_invalid value=$ver" >&2
            exit 1
          fi
          {
            echo "version=$ver"
            echo "channel=$ch"
            echo "tag=dumpagent-go-$ver"
            echo "dry_run=$dry"
          } >> "$GITHUB_OUTPUT"

  # Guards against re-publishing a version municipalities may already have
  # downloaded. Separate job (not a build step) so R2 write credentials
  # never touch the job that runs the Go toolchain.
  preflight:
    needs: resolve
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_KEY }}
      AWS_REGION: ${{ secrets.RELEASES_S3_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.RELEASES_S3_ENDPOINT }}
    steps:
      - name: Record AWS CLI version
        run: aws --version

      - name: Reject re-publish of an existing version
        env:
          BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -uo pipefail
          key="dumpagent/${VERSION}/windows-amd64/dumpagent-${VERSION}-windows-amd64.zip"
          # HeadObject reports both a missing key and an auth/permission problem as a
          # generic error with no response body, so the exit code alone cannot tell
          # "safe to publish" apart from "R2 is unreachable/misconfigured". Fail closed:
          # only a confirmed 404/Not Found/NoSuchKey means the version is unpublished;
          # any other error (403, throttling, network) blocks the release.
          stderr=$(aws s3api head-object --bucket "$BUCKET" --key "$key" 2>&1 >/dev/null)
          head_status=$?
          set -e
          if [ "$head_status" -eq 0 ]; then
            echo "version_already_published value=$VERSION" >&2
            exit 1
          fi
          if ! echo "$stderr" | grep -qE '\(404\)|Not Found|NoSuchKey'; then
            echo "preflight_head_object_error value=$VERSION status=$head_status" >&2
            echo "$stderr" >&2
            exit 1
          fi

  # Reuses the PR quality gates (lint, vet, race tests, coverage >=65%,
  # OpenAPI drift, Windows Firebird integration) instead of a weaker
  # release-local sanity check.
  gate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/dump-agent-go.yml

  build:
    needs: [resolve, preflight, gate]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.dry_run == 'true' ||
       (needs.preflight.result == 'success' && needs.gate.result == 'success'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dump_agent_go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: apps/dump_agent_go/go.sum

      - name: Cross-compile Windows amd64
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o dist/dumpagent.exe ./cmd/dumpagent

      - name: Log artifact size
        run: ls -la dist/dumpagent.exe

      - name: Create .zip (exe only, junk paths) + sha256
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          zip -j "dumpagent-${VERSION}-windows-amd64.zip" dumpagent.exe
          sha256sum "dumpagent-${VERSION}-windows-amd64.zip" > \
            "dumpagent-${VERSION}-windows-amd64.zip.sha256"

      - name: Verify zip content (only dumpagent.exe)
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          count=$(unzip -l "dumpagent-${VERSION}-windows-amd64.zip" | \
            awk '/dumpagent\.exe/{c++} END{print c+0}')
          if [ "$count" -ne 1 ]; then
            echo "zip_content_invalid expected=1 got=$count" >&2
            unzip -l "dumpagent-${VERSION}-windows-amd64.zip" >&2
            exit 1
          fi

      - name: Generate update manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TAG: ${{ needs.resolve.outputs.tag }}
          BASE_URL: ${{ vars.RELEASES_PUBLIC_BASE_URL }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "releases_public_base_url_unset" >&2
            exit 1
          fi
          base="${BASE_URL%/}"
          zip_name="dumpagent-${VERSION}-windows-amd64.zip"
          sha256=$(awk '{print $1}' "dist/${zip_name}.sha256")
          size=$(stat -c%s "dist/${zip_name}")
          released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          min_supported_version=$(tr -d '[:space:]' < MIN_SUPPORTED_VERSION)
          jq -n \
            --argjson schema_version 1 \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg released_at "$released_at" \
            --arg min_supported_version "$min_supported_version" \
            --arg release_notes_url "${SERVER_URL}/${REPOSITORY}/releases/tag/${TAG}" \
            --arg url "${base}/dumpagent/${VERSION}/windows-amd64/${zip_name}" \
            --arg fallback_url "${SERVER_URL}/${REPOSITORY}/releases/download/${TAG}/${zip_name}" \
            --arg sha256 "$sha256" \
            --argjson size "$size" \
            '{
              schema_version: $schema_version,
              channel: $channel,
              version: $version,
              released_at: $released_at,
              min_supported_version: $min_supported_version,
              release_notes_url: $release_notes_url,
              artifacts: {
                "windows-amd64": {
                  url: $url,
                  fallback_url: $fallback_url,
                  sha256: $sha256,
                  size: $size
                }
              }
            }' > dist/release.json
          cat dist/release.json

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Validate manifest against contract schema
        run: |
          uvx check-jsonschema \
            --schemafile "$GITHUB_WORKSPACE/docs/contracts/dumpagent-update-manifest.schema.json" \
            dist/release.json

      - uses: actions/upload-artifact@v4
        with:
          name: dumpagent-${{ needs.resolve.outputs.version }}
          path: |
            apps/dump_agent_go/dist/*.zip
            apps/dump_agent_go/dist/*.sha256
            apps/dump_agent_go/dist/release.json

  # GitHub Release is created as a draft: no published release exists
  # while R2 is still being written. Undrafted last, in `promote`.
  github-release:
    needs: [resolve, build]
    if: needs.resolve.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dumpagent-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--draft --generate-notes --title "dumpagent $TAG")
            [ "$CHANNEL" = "rc" ] && args+=(--prerelease)
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" \
            dist/*.zip dist/*.sha256 dist/release.json \
            --clobber

  publish-r2:
    needs: [resolve, build, github-release]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.resolve.outputs.dry_run == 'true' || needs.github-release.result == 'success')
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_KEY }}
      AWS_REGION: ${{ secrets.RELEASES_S3_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.RELEASES_S3_ENDPOINT }}
      BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dumpagent-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Record AWS CLI version
        run: aws --version

      - name: Upload immutable objects
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          base="dumpagent/${VERSION}"
          if [ "$DRY_RUN" = "true" ]; then
            base="dumpagent/_dryrun/${RUN_ID}/${VERSION}"
          fi
          immutable='public, max-age=31536000, immutable'
          zip_name="dumpagent-${VERSION}-windows-amd64.zip"
          aws s3 cp "dist/${zip_name}" \
            "s3://${BUCKET}/${base}/windows-amd64/${zip_name}" \
            --cache-control "$immutable" --content-type application/zip
          aws s3 cp "dist/${zip_name}.sha256" \
            "s3://${BUCKET}/${base}/windows-amd64/${zip_name}.sha256" \
            --cache-control "$immutable" --content-type text/plain
          aws s3 cp dist/release.json "s3://${BUCKET}/${base}/release.json" \
            --cache-control "$immutable" --content-type application/json

  # Channel manifest is the last write in the pipeline: every URL it
  # references (R2 primary and GitHub fallback) is already live.
  promote:
    needs: [resolve, build, publish-r2]
    if: needs.resolve.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release (undraft)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

      - name: Point channel manifest at the new version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_KEY }}
          AWS_REGION: ${{ secrets.RELEASES_S3_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.RELEASES_S3_ENDPOINT }}
          BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          # aws s3 cp defaults --metadata-directive to COPY for an S3-to-S3 copy, which
          # means --cache-control/--content-type below would be silently ignored and the
          # channel manifest would inherit the source's 1-year immutable header -- the
          # 60s rollback-propagation guarantee in dumpagent-release.md would be false.
          aws s3 cp "s3://${BUCKET}/dumpagent/${VERSION}/release.json" \
            "s3://${BUCKET}/dumpagent/${CHANNEL}/latest.json" \
            --metadata-directive REPLACE \
            --cache-control 'public, max-age=60, must-revalidate' \
            --content-type application/json
