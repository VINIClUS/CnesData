name: python-quality

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/central_api/**'
      - 'apps/billing_worker/**'
      - 'apps/data_processor/**'
      - 'tests/**'
      - 'scripts/flag_quality_violation.py'
      - '.github/workflows/python-quality.yml'
      - 'pytest.ini'
      - 'docs/contracts/openapi.json'
      - '.github/workflows/stripe-billing-e2e.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
  COD_MUN_IBGE: "354130"
  ID_MUNICIPIO_IBGE7: "3541308"
  CNPJ_MANTENEDORA: "55293427000117"
  COMPETENCIA_ANO: "2026"
  COMPETENCIA_MES: "1"

jobs:
  phase2-adapter-conformance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"
      - run: uv sync --locked --all-packages
      - name: Run Phase 2 adapter conformance
        run: bash scripts/ci_phase2_adapters.sh

  aws-runtime-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"
      - run: uv sync --locked --all-packages
      - name: Start AWS emulators
        run: docker compose --profile aws-test up -d --wait dynamodb-local localstack
      - name: Run AWS runtime integration suite
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          DYNAMODB_ENDPOINT_URL: http://127.0.0.1:18000
        run: uv run --no-build pytest -m "dynamodb_local and s3_integration" tests/integration/aws
      - name: Run billing suites against DynamoDB Local
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DYNAMODB_ENDPOINT_URL: http://127.0.0.1:18000
        run: >-
          uv run --no-build pytest -rs -m dynamodb_local
          tests/integration/billing tests/chaos/test_stripe_projection_failures.py
          --junitxml=billing-dynamodb-local.xml
      - name: Fail when billing DynamoDB Local tests were skipped
        run: >-
          uv run --no-build python -c "import sys, xml.etree.ElementTree as ET;
          suite = ET.parse('billing-dynamodb-local.xml').getroot().find('testsuite');
          sys.exit(f'billing_dynamodb_local_skipped={suite.get(\"skipped\")}' if int(suite.get('skipped')) else 0)"
      - name: Stop AWS emulators
        if: always()
        run: docker compose --profile aws-test down -v

  billing-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"
      - run: uv sync --locked --all-packages
      - name: Billing CI contract
        run: uv run --no-build pytest -q tests/scripts/test_ci_billing.py tests/scripts/test_ci_aws_runtime.py
      - name: Billing acceptance matrix without Stripe network
        run: >-
          uv run --no-build pytest -q
          -m "not e2e and not postgres and not dynamodb_local and not stripe"
          packages/cnes_domain/tests/billing packages/cnes_infra/tests/billing
          apps/central_api/tests apps/billing_worker/tests
          tests/property/test_entitlement_projection_cas.py
          tests/property/test_quota_last_unit_race.py
          tests/property/test_stripe_event_reordering.py
          tests/chaos/test_quota_reservation_recovery.py
          tests/chaos/test_revocation_publish_fence.py
          tests/chaos/test_billing_reconciliation_resume.py
          tests/chaos/test_stripe_customer_orphan_recovery.py
          tests/chaos/test_shadow_observer_failures.py
          tests/integration/billing
      - name: Local billing has no remote dependency
        env:
          BILLING_MODE: disabled
        run: uv run --no-build pytest -q tests/negative/test_local_billing_has_no_remote_dependency.py

  n-plus-1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cnesdata
          POSTGRES_PASSWORD: cnesdata_test
          POSTGRES_DB: cnesdata_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cnesdata -d cnesdata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: |
          pip install --upgrade pip
          pip install -e packages/cnes_contracts packages/cnes_domain packages/cnes_infra
          pip install -e apps/central_api apps/data_processor
          pip install pytest pytest-asyncio hypothesis
      - name: Migrate
        run: cd packages/cnes_infra && alembic -c alembic.ini upgrade head
      - name: N+1 tests
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pytest apps/central_api/tests/ -v -k "assert_query_limit or query_counter"
      - name: Flag violation
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/flag_quality_violation.py --kind n+1 --details "route test failure"

  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cnesdata
          POSTGRES_PASSWORD: cnesdata_test
          POSTGRES_DB: cnesdata_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cnesdata -d cnesdata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: |
          pip install -e packages/cnes_contracts packages/cnes_domain packages/cnes_infra
          pip install pytest hypothesis "moto[dynamodb]>=5.2"
      - name: Migrate
        run: cd packages/cnes_infra && alembic -c alembic.ini upgrade head
      - name: Race tests
        run: pytest tests/property/ -m race --hypothesis-show-statistics -v
      - name: Flag violation
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/flag_quality_violation.py --kind race --details "race detected"

  memleak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: |
          pip install -e packages/cnes_contracts packages/cnes_domain packages/cnes_infra
          pip install -e apps/central_api apps/data_processor
          pip install pytest pytest-memray
      - name: Memleak tests
        run: pytest tests/memory/ -m memleak --memray --memray-bin-path=/tmp/memray/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memray-snapshots-${{ github.run_number }}
          path: /tmp/memray/
      - name: Flag violation
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/flag_quality_violation.py --kind memleak --details "memory threshold exceeded"

  chaos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cnesdata
          POSTGRES_PASSWORD: cnesdata_test
          POSTGRES_DB: cnesdata_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cnesdata -d cnesdata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: |
          pip install -e packages/cnes_contracts packages/cnes_domain packages/cnes_infra
          pip install -e apps/central_api apps/data_processor
          pip install pytest pytest-asyncio httpx minio "moto[dynamodb]>=5.2"
      - name: Chaos tests
        run: pytest tests/chaos/ -m "chaos and not chaos_infra" -v
      - name: Flag violation
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/flag_quality_violation.py --kind chaos --details "resilience test failure"

  chaos-infra:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-chaos')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: |
          pip install -e packages/cnes_contracts packages/cnes_domain packages/cnes_infra
          pip install -e apps/central_api apps/data_processor
          pip install pytest pytest-asyncio httpx minio testcontainers[postgres,minio] sqlalchemy
      - name: Chaos infra tests
        run: pytest tests/chaos/ -m chaos_infra -v
      - name: Flag violation
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/flag_quality_violation.py --kind chaos --details "infra chaos failure"

  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: |
          pip install -e packages/cnes_contracts packages/cnes_domain packages/cnes_infra
          pip install pytest hypothesis sqlalchemy
      - name: Negative tests
        run: pytest tests/negative/ -m negative -v
      - name: Flag violation
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/flag_quality_violation.py --kind negative --details "input validation failure"
