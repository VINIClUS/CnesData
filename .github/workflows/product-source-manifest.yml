# Produtor do manifesto de fonte do produto (P09, D6): o gate de aplicação do infra-ansible
# autentica o artefato deste run em S (head_sha == S, run completed/success) e confere o membro
# product-source-manifest.json contra application_product_source_closure_sha256.
name: product-source-manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: product-source-manifest-${{ github.sha }}
  cancel-in-progress: false

jobs:
  manifest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Gerar o manifesto de fonte do produto
        env:
          SOURCE_SHA: ${{ github.sha }}
          MANIFEST: ${{ runner.temp }}/product-source-manifest/product-source-manifest.json
        run: |
          set -euo pipefail
          python -B -m scripts.promotion.product_source_manifest --source-sha "$SOURCE_SHA" \
            --output "$MANIFEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: product-source-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-source-manifest/product-source-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Registrar a referência do artefato
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          echo "product_source_manifest artifact_id=${ARTIFACT_ID}" \
            "artifact_digest=sha256:${ARTIFACT_DIGEST}"
          sleep 3
