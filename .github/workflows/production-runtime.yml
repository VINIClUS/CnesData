name: production-runtime-acceptance

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  BILLING_MODE: disabled
  CI: true
  DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
  COD_MUN_IBGE: "354130"
  ID_MUNICIPIO_IBGE7: "3541308"
  CNPJ_MANTENEDORA: "55293427000117"
  COMPETENCIA_ANO: "2026"
  COMPETENCIA_MES: "1"

jobs:
  runtime-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      BILLING_MODE: disabled
      CI: true
      DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
      COD_MUN_IBGE: "354130"
      ID_MUNICIPIO_IBGE7: "3541308"
      CNPJ_MANTENEDORA: "55293427000117"
      COMPETENCIA_ANO: "2026"
      COMPETENCIA_MES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"
      - name: Install dependencies
        run: uv sync --locked --all-packages
      - name: Runtime Python contracts
        id: python-contracts
        run: >-
          timeout --signal=INT --kill-after=15s 600
          uv run --no-build pytest -q
          -m "not integration and not postgres and not bigquery and not e2e
          and not stress and not soak and not spike and not windows_only
          and not s3_integration and not dynamodb_local and not floci"
          tests/production --ignore=tests/production/infra
          apps/central_api/tests/auth/test_aws_oidc.py
          apps/central_api/tests/test_production_cors.py
          apps/central_api/tests/routes/test_oauth_routes.py
          apps/central_api/tests/routes/test_production_serving.py
          packages/cnes_infra/tests/aws/test_production_settings.py
          packages/cnes_infra/tests/executor/test_production_network.py
          packages/cnes_infra/tests/control_plane/test_environment_gate.py
          packages/cnes_infra/tests/control_plane/test_edge_agent_fence.py
          packages/cnes_infra/tests/control_plane/test_execution_quota.py
          packages/cnes_domain/tests/orchestration/test_dispatch_admission.py
          packages/cnes_domain/tests/orchestration/test_dispatch_admission_quota.py
          packages/cnes_infra/tests/control_plane/test_outbox_cursor.py
          packages/cnes_infra/tests/control_plane/test_outbox_cursor_reads.py
          packages/cnes_infra/tests/control_plane/test_outbox_cursor_dynamodb_boundary.py
          packages/cnes_infra/tests/control_plane/test_outbox_cursor_sqlite_boundary.py
          apps/central_api/tests/test_tenant_discovery.py
          apps/central_api/tests/test_outbox_cursor_loop.py
          apps/central_api/tests/test_aws_no_outbox.py
          apps/data_processor/tests/test_aws_invocation_preflight.py
          apps/data_processor/tests/test_aws_mode_settings_preflight.py
          apps/data_processor/tests/test_aws_mode_composition.py
          apps/data_processor/tests/test_aws_entrypoint.py
          apps/data_processor/tests/test_recovery_mode.py
          apps/data_processor/tests/test_audit_dispatch_mode.py
          apps/data_processor/tests/test_audit_dispatch_deadline.py
          apps/data_processor/tests/test_aws_bootstrap_deadline.py
          apps/data_processor/tests/test_aws_main_exit_codes.py
          apps/data_processor/tests/test_deadline_watchdog.py
          --junitxml=runtime-python.xml
      - name: Runtime CI contracts
        run: >-
          timeout --signal=INT --kill-after=15s 120
          uv run --no-build pytest -q tests/scripts/test_ci_aws_runtime.py
      - name: Validate Python report
        id: validate-python
        run: |
          python -c "import runpy; from pathlib import Path; \
          runpy.run_path('tests/production/test_runtime_acceptance.py')\
          ['require_complete_junit'](Path('runtime-python.xml'))"

  runtime-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web_dashboard
    env:
      BILLING_MODE: disabled
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile
      - name: Runtime dashboard contracts
        id: dashboard-contracts
        run: >-
          timeout --signal=INT --kill-after=15s 300
          bun run test --run
          tests/unit/api/production-client.test.ts
          tests/unit/api/client.test.ts
          tests/unit/hooks/useActivate.test.tsx
          tests/unit/auth/oidc-production.test.ts
          tests/unit/lib/env.test.ts
          tests/unit/routes/tenant-discovery.test.tsx
          tests/unit/auth/tenant-discovery-cache.test.tsx
          tests/unit/auth/guard-session-race.test.tsx
          --reporter=default --reporter=junit --outputFile=runtime-dashboard.xml
      - name: Validate dashboard report
        id: validate-dashboard
        working-directory: .
        run: |
          python -c "import runpy; from pathlib import Path; \
          runpy.run_path('tests/production/test_runtime_acceptance.py')\
          ['require_complete_junit'](Path('apps/web_dashboard/runtime-dashboard.xml'))"

  runtime-emulators:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    env:
      BILLING_MODE: disabled
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"
      - name: Install dependencies
        run: uv sync --locked --all-packages
      - name: Start AWS emulators
        id: start-aws
        env:
          COMPOSE_PROJECT_NAME: runtime377-aws-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          timeout --signal=INT --kill-after=15s 180
          docker compose --profile aws-test up -d --wait dynamodb-local localstack
      - name: Runtime AWS contracts
        id: aws-contracts
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          DYNAMODB_ENDPOINT_URL: http://127.0.0.1:18000
          AWS_EC2_METADATA_DISABLED: "true"
        run: >-
          timeout --signal=INT --kill-after=15s 420
          uv run --no-build pytest -rs -m "dynamodb_local and s3_integration"
          tests/integration/aws --junitxml=runtime-emulators.xml
      - name: Validate AWS report
        id: validate-aws
        run: |
          python -c "import runpy; from pathlib import Path; \
          runpy.run_path('tests/production/test_runtime_acceptance.py')\
          ['require_complete_junit'](Path('runtime-emulators.xml'))"
      - name: Start Floci
        id: start-floci
        env:
          COMPOSE_PROJECT_NAME: runtime377-floci-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          timeout --signal=INT --kill-after=15s 120
          docker compose --profile floci up -d --wait floci
      - name: Runtime Floci contracts
        id: floci-contracts
        env:
          FLOCI_ENDPOINT_URL: http://127.0.0.1:4577
        run: >-
          timeout --signal=INT --kill-after=15s 600
          uv run --no-build pytest -rs -m floci tests/integration/floci
          --junitxml=runtime-floci.xml
      - name: Validate Floci report
        id: validate-floci
        run: |
          python -c "import runpy; from pathlib import Path; \
          runpy.run_path('tests/production/test_runtime_acceptance.py')\
          ['require_complete_junit'](Path('runtime-floci.xml'))"
      - name: Stop AWS emulators
        id: stop-aws
        if: always()
        timeout-minutes: 2
        env:
          COMPOSE_PROJECT_NAME: runtime377-aws-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          timeout --signal=INT --kill-after=15s 90
          docker compose --profile aws-test down -v --remove-orphans
      - name: Stop Floci
        id: stop-floci
        if: always()
        timeout-minutes: 2
        env:
          COMPOSE_PROJECT_NAME: runtime377-floci-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          timeout --signal=INT --kill-after=15s 90
          docker compose --profile floci down -v --remove-orphans

  production-runtime-acceptance:
    name: production-runtime-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [runtime-python, runtime-dashboard, runtime-emulators]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Require successful runtime producers
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs['runtime-python'].result }}
          DASHBOARD_RESULT: ${{ needs['runtime-dashboard'].result }}
          EMULATORS_RESULT: ${{ needs['runtime-emulators'].result }}
        run: |
          if [[ "$PYTHON_RESULT" != "success" || "$DASHBOARD_RESULT" != "success" ||
                "$EMULATORS_RESULT" != "success" ]]; then
            printf 'runtime_producer_result python=%s dashboard=%s emulators=%s\n' \
              "$PYTHON_RESULT" "$DASHBOARD_RESULT" "$EMULATORS_RESULT" >&2
            exit 1
          fi
