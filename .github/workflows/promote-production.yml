---
name: promote-production

"on":
  workflow_dispatch:
    inputs:
      source_sha:
        description: SHA completo da release, contido em develop
        required: true
        type: string
      plan_evidence_id:
        description: Evidência do platform plan aprovada pelo dono
        required: true
        type: string
      plan_evidence_digest:
        required: true
        type: string
      plan_run_id:
        required: true
        type: string
      artifact_id:
        description: Artefato do archive de host de um run anterior concluído
        required: true
        type: string
      artifact_digest:
        required: true
        type: string

permissions: {}

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  preamble:
    if: github.ref == 'refs/heads/develop' && github.sha == inputs.source_sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Recusar SHA fora de develop e check obrigatório não verde
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVIDENCE: ${{ runner.temp }}/preamble.json
        run: |
          set -euo pipefail
          compare="$(gh api "repos/$REPOSITORY/compare/$SOURCE_SHA...develop")"
          checks="$(gh api --paginate --slurp \
            "repos/$REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" \
            | jq '{total_count: .[0].total_count, check_runs: [.[].check_runs[]]}')"
          jq -n --arg sha "$SOURCE_SHA" --argjson compare "$compare" --argjson checks "$checks" \
            '{source_sha: $sha, compare: $compare, check_runs: $checks}' > "$EVIDENCE"
          python -m scripts.promotion._api_static_preamble --evidence "$EVIDENCE"

  closed-ready:
    needs: preamble
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      closed_ready_sha256: ${{ steps.ready.outputs.closed_ready_sha256 }}
    steps:
      - name: Recusar sem produtor autenticado de close-drain e Phase B
        id: ready
        run: |
          echo "closed_ready=refused reason=close_drain_capability owner=infra-ansible#55" >&2
          exit 1

  host-gate:
    needs: [preamble, closed-ready]
    permissions:
      actions: read
      contents: read
      checks: read
      id-token: write
    uses: VINIClUS/infra-ansible/.github/workflows/reusable-cnesdata-host-deploy-gate.yml@1a2a78898211317885b216c16f7a9ec585f98173
    with:
      plan_evidence_id: ${{ inputs.plan_evidence_id }}
      plan_evidence_digest: ${{ inputs.plan_evidence_digest }}
      plan_run_id: ${{ inputs.plan_run_id }}
      artifact_id: ${{ inputs.artifact_id }}
      artifact_digest: ${{ inputs.artifact_digest }}
    secrets:
      host_governance: ${{ secrets.CNESDATA_HOST_GOVERNANCE }}

  host-outcome:
    needs: [closed-ready, host-gate]
    if: >-
      always() && needs.closed-ready.result == 'success'
      && (needs.host-gate.result == 'success' || needs.host-gate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.26"
      - run: uv sync --locked --all-packages
      - name: Autenticar o handoff público e decidir o passo seguinte
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CALLER_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          STATUS: ${{ needs.host-gate.outputs.status }}
          HOST_EVIDENCE_SHA256: ${{ needs.host-gate.outputs.host_evidence_sha256 }}
          CLOSED_READY_SHA256: ${{ needs.closed-ready.outputs.closed_ready_sha256 }}
          WORK: ${{ runner.temp }}/handoff
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          gh api --paginate --slurp \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            | jq '{total_count: .[0].total_count, jobs: [.[].jobs[]]}' > "$WORK/jobs.json"
          name="cnesdata-host-handoff-$RUN_ID-$RUN_ATTEMPT"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?name=$name" \
            > "$WORK/artifacts.json"
          artifact="$(jq -r 'if .total_count == 1 then .artifacts[0].id else "" end' \
            "$WORK/artifacts.json")"
          : > "$WORK/handoff.zip"
          if [ -n "$artifact" ]; then
            gh api "repos/$REPOSITORY/actions/artifacts/$artifact/zip" > "$WORK/handoff.zip"
          fi
          jq -n --arg status "$STATUS" --arg evidence "$HOST_EVIDENCE_SHA256" \
            '{status: $status, host_evidence_sha256: $evidence}' > "$WORK/outputs.json"
          jq -n --arg repository "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg ref "$CALLER_REF" \
            --arg workflow_sha "$WORKFLOW_SHA" --argjson run "$RUN_ID" \
            --argjson attempt "$RUN_ATTEMPT" \
            '{repository: $repository, source_sha: $sha, ref: $ref,
              workflow_path: ".github/workflows/promote-production.yml",
              workflow_sha: $workflow_sha, run_id: $run, run_attempt: $attempt}' \
            > "$WORK/caller.json"
          uv run --no-sync python -m scripts.promotion._api_static_handoff \
            --jobs "$WORK/jobs.json" --artifacts "$WORK/artifacts.json" \
            --outputs "$WORK/outputs.json" --caller "$WORK/caller.json" \
            --archive "$WORK/handoff.zip" --closed-ready-sha256 "$CLOSED_READY_SHA256"
