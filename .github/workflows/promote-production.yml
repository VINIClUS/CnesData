---
name: promote-production

"on":
  workflow_dispatch:
    inputs:
      source_sha:
        description: SHA completo da release, contido em main
        required: true
        type: string
      plan_evidence_id:
        description: Evidência do platform plan aprovada pelo dono
        required: true
        type: string
      plan_evidence_digest:
        required: true
        type: string
      plan_run_id:
        required: true
        type: string
      artifact_id:
        description: Artefato do archive de host de um run anterior concluído
        required: true
        type: string
      artifact_digest:
        required: true
        type: string

permissions: {}

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - name: Validar contexto exato antes de qualquer job com environment ou OIDC
        id: admit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "VINIClUS/CnesData"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  preamble:
    needs: admit
    if: github.ref == 'refs/heads/main' && github.sha == inputs.source_sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Recusar SHA fora de main e check obrigatório não verde
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVIDENCE: ${{ runner.temp }}/preamble.json
        run: |
          set -euo pipefail
          compare="$(gh api "repos/$REPOSITORY/compare/$SOURCE_SHA...main")"
          checks="$(gh api --paginate --slurp \
            "repos/$REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" \
            | jq '{total_count: .[0].total_count, check_runs: [.[].check_runs[]]}')"
          jq -n --arg sha "$SOURCE_SHA" --argjson compare "$compare" --argjson checks "$checks" \
            '{source_sha: $sha, compare: $compare, check_runs: $checks}' > "$EVIDENCE"
          python -m scripts.promotion._api_static_preamble --evidence "$EVIDENCE"

  descriptor:
    needs: [admit, preamble]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      request_descriptor: ${{ steps.descriptor.outputs.request_descriptor }}
      request_descriptor_sha256: ${{ steps.descriptor.outputs.request_descriptor_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Gerar o descriptor do request de lifecycle do application
        id: descriptor
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_WORKFLOW_SHA: 6cb0bb2f46007c3679d64f62106ee02bf8758c5d
          PRODUCER_SOURCE_CLOSURE_SHA256: c29be4e3dbcce9ff59d220ca235f0f4b12dc6b4c69232408e3e3ded620f23c93
        run: |
          set -euo pipefail
          python -m scripts.promotion.lifecycle_descriptor \
            --step application-inventory --purpose promotion \
            --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --producer-workflow-sha "$PRODUCER_WORKFLOW_SHA" \
            --producer-closure-sha256 "$PRODUCER_SOURCE_CLOSURE_SHA256" \
            --output "$GITHUB_OUTPUT"

  application:
    needs: [admit, descriptor]
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    uses: VINIClUS/infra-ansible/.github/workflows/reusable-cnesdata-application-gate.yml@6cb0bb2f46007c3679d64f62106ee02bf8758c5d
    with:
      request_descriptor: ${{ needs.descriptor.outputs.request_descriptor }}
      request_descriptor_sha256: ${{ needs.descriptor.outputs.request_descriptor_sha256 }}
      contract_repository: VINIClUS/infra-ansible
      contract_source_sha: 6cb0bb2f46007c3679d64f62106ee02bf8758c5d
      contract_path: docs/cnesdata-delivery-application-lifecycle.md
      contract_sha256: e28f3fccd86df77d16e49b5e7e8f54308433a362cc1e751377cbac93bf023cb8
      expected_source_sha: ${{ needs.admit.outputs.source_sha }}
      purpose: application-prepare
    secrets:
      CNESDATA_DELIVERY_GOVERNANCE: ${{ secrets.CNESDATA_DELIVERY_GOVERNANCE }}

  closed-ready:
    needs: preamble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      closed_ready_sha256: ${{ steps.probe.outputs.closed_ready_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Esperar o artefato closed-ready do keeper e expor o hash
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          APPLICATION_JOB: application / execute
        run: python -m scripts.promotion.closed_ready_probe

  host-gate:
    needs: [preamble, closed-ready]
    permissions:
      actions: read
      contents: read
      checks: read
      id-token: write
    uses: VINIClUS/infra-ansible/.github/workflows/reusable-cnesdata-host-deploy-gate.yml@6cb0bb2f46007c3679d64f62106ee02bf8758c5d
    with:
      plan_evidence_id: ${{ inputs.plan_evidence_id }}
      plan_evidence_digest: ${{ inputs.plan_evidence_digest }}
      plan_run_id: ${{ inputs.plan_run_id }}
      artifact_id: ${{ inputs.artifact_id }}
      artifact_digest: ${{ inputs.artifact_digest }}
    secrets:
      host_governance: ${{ secrets.CNESDATA_HOST_GOVERNANCE }}

  host-outcome:
    needs: [closed-ready, host-gate]
    if: >-
      always() && needs.closed-ready.result == 'success'
      && (needs.host-gate.result == 'success' || needs.host-gate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.26"
      - run: uv sync --locked --all-packages
      - name: Autenticar o handoff público e decidir o passo seguinte
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CALLER_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          STATUS: ${{ needs.host-gate.outputs.status }}
          HOST_EVIDENCE_SHA256: ${{ needs.host-gate.outputs.host_evidence_sha256 }}
          CLOSED_READY_SHA256: ${{ needs.closed-ready.outputs.closed_ready_sha256 }}
          WORK: ${{ runner.temp }}/handoff
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          gh api --paginate --slurp \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            | jq '{total_count: .[0].total_count, jobs: [.[].jobs[]]}' > "$WORK/jobs.json"
          name="cnesdata-host-handoff-$RUN_ID-$RUN_ATTEMPT"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?name=$name" \
            > "$WORK/artifacts.json"
          artifact="$(jq -r 'if .total_count == 1 then .artifacts[0].id else "" end' \
            "$WORK/artifacts.json")"
          : > "$WORK/handoff.zip"
          if [ -n "$artifact" ]; then
            gh api "repos/$REPOSITORY/actions/artifacts/$artifact/zip" > "$WORK/handoff.zip"
          fi
          jq -n --arg status "$STATUS" --arg evidence "$HOST_EVIDENCE_SHA256" \
            '{status: $status, host_evidence_sha256: $evidence}' > "$WORK/outputs.json"
          jq -n --arg repository "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg ref "$CALLER_REF" \
            --arg workflow_sha "$WORKFLOW_SHA" --argjson run "$RUN_ID" \
            --argjson attempt "$RUN_ATTEMPT" \
            '{repository: $repository, source_sha: $sha, ref: $ref,
              workflow_path: ".github/workflows/promote-production.yml",
              workflow_sha: $workflow_sha, run_id: $run, run_attempt: $attempt}' \
            > "$WORK/caller.json"
          uv run --no-sync python -m scripts.promotion._api_static_handoff \
            --jobs "$WORK/jobs.json" --artifacts "$WORK/artifacts.json" \
            --outputs "$WORK/outputs.json" --caller "$WORK/caller.json" \
            --archive "$WORK/handoff.zip" --closed-ready-sha256 "$CLOSED_READY_SHA256"
