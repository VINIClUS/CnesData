name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'apps/central_api/**'
      - 'apps/data_processor/**'
      - 'apps/cnes_db_migrator/**'
      - 'pyproject.toml'
      - '.coveragerc'
      - 'docs/contracts/openapi.json'
      - 'docs/contracts/schemas/**'
      - '.github/workflows/ci.yml'
      - 'docker-compose.yml'
      - 'scripts/ci_python_gate.sh'
      - 'scripts/ci_phase2_adapters.sh'
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'apps/central_api/**'
      - 'apps/data_processor/**'
      - 'apps/cnes_db_migrator/**'
      - 'pyproject.toml'
      - '.coveragerc'
      - 'docs/contracts/openapi.json'
      - 'docs/contracts/schemas/**'
      - '.github/workflows/ci.yml'
      - 'docker-compose.yml'
      - 'scripts/ci_python_gate.sh'
      - 'scripts/ci_phase2_adapters.sh'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-coverage:
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
      PG_TEST_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
      COMPETENCIA_ANO: "2026"
      COMPETENCIA_MES: "1"
      DISABLE_PANDERA_IMPORT_WARNING: "True"
      COD_MUN_IBGE: "354130"
      ID_MUNICIPIO_IBGE7: "3541308"
      CNPJ_MANTENEDORA: "55293427000117"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cnesdata
          POSTGRES_PASSWORD: cnesdata_test
          POSTGRES_DB: cnesdata_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cnesdata -d cnesdata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Run Python gate
        run: bash scripts/ci_python_gate.sh

      - name: Run Phase 2 adapter conformance
        run: bash scripts/ci_phase2_adapters.sh
