name: infra-native

on:
  pull_request:
  push:
    branches: [develop, main]
    paths:
      - 'infra/**'
      - 'policies/**'
      - 'schemas/**'
      - 'tests/fixtures/**'
      - 'tests/production/infra/**'
      - 'tests/production/test_runtime_acceptance.py'
      - 'tests/scripts/test_ci_opentofu_runner.py'
      - 'tests/integration/aws_capability/_fargate_mirror.py'
      - 'tests/integration/aws_capability/_matrix_policies.py'
      - 'apps/data_processor/Dockerfile'
      - 'apps/data_processor/src/**'
      - 'apps/web_dashboard/src/auth/oidcSettings.ts'
      - 'apps/web_dashboard/src/lib/env.ts'
      - 'packages/cnes_contracts/**'
      - 'packages/cnes_domain/**'
      - 'packages/cnes_*/**'
      - '!packages/*/tests/**'
      - 'packages/cnes_runtime/tests/aws/production_values.py'
      - 'packages/cnes_control_plane/tests/fixtures/step_functions/**'
      - 'docs/development.md'
      - 'docs/runbooks/athena-operator.md'
      - 'docs/superpowers/specs/2026-11-01-athena-observability-cost-amendment.md'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'uv.lock'
      - '.gitignore'
      - '.github/CODEOWNERS'
      - '.github/workflows/deploy-main.yml'
      - '.github/workflows/infra-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opentofu-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    env:
      CI: true
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect infrastructure changes
        id: changes
        timeout-minutes: 2
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          infra=true
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            infra=false
            patterns=(
              'infra/**'
              'policies/**'
              'schemas/**'
              'tests/fixtures/**'
              'tests/production/infra/**'
              'tests/production/test_runtime_acceptance.py'
              'tests/scripts/test_ci_opentofu_runner.py'
              'tests/integration/aws_capability/_fargate_mirror.py'
              'tests/integration/aws_capability/_matrix_policies.py'
              'apps/data_processor/Dockerfile'
              'apps/data_processor/src/**'
              'apps/web_dashboard/src/auth/oidcSettings.ts'
              'apps/web_dashboard/src/lib/env.ts'
              'packages/cnes_contracts/**'
              'packages/cnes_domain/**'
              'packages/cnes_*/**'
              '!packages/*/tests/**'
              'packages/cnes_runtime/tests/aws/production_values.py'
              'packages/cnes_control_plane/tests/fixtures/step_functions/**'
              'docs/development.md'
              'docs/runbooks/athena-operator.md'
              'docs/superpowers/specs/2026-11-01-athena-observability-cost-amendment.md'
              'conftest.py'
              'pyproject.toml'
              'pytest.ini'
              'uv.lock'
              '.gitignore'
              '.github/CODEOWNERS'
              '.github/workflows/deploy-main.yml'
              '.github/workflows/infra-native.yml'
            )
            while IFS= read -r -d '' changed; do
              matched=false
              for pattern in "${patterns[@]}"; do
                # shellcheck disable=SC2053
                if [[ ${pattern} == '!'* && ${changed} == ${pattern:1} ]]; then
                  matched=false
                elif [[ ${changed} == ${pattern} ]]; then
                  matched=true
                fi
              done
              if [[ ${matched} = true ]]; then infra=true; fi
            done < <(git diff -z --no-renames --name-only HEAD^1 HEAD)
          fi
          echo "infra=${infra}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.infra == 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        if: steps.changes.outputs.infra == 'true'
        with:
          version: "0.9.26"
      # v1.0.8
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        if: steps.changes.outputs.infra == 'true'
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false
      - name: Install Trivy
        if: steps.changes.outputs.infra == 'true'
        timeout-minutes: 5
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          release="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          curl -fsSL --proto '=https' --retry 3 -o "${archive}" \
            "${release}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
      - name: Install conftest
        if: steps.changes.outputs.infra == 'true'
        env:
          CONFTEST_VERSION: "0.71.1"
          CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
        run: |
          set -euo pipefail
          repo="https://github.com/open-policy-agent/conftest"
          release="${repo}/releases/download/v${CONFTEST_VERSION}"
          archive="${RUNNER_TEMP}/conftest.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "${release}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/conftest-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/conftest-bin" conftest
          echo "${RUNNER_TEMP}/conftest-bin" >> "${GITHUB_PATH}"
      - name: Create provider cache directory
        if: steps.changes.outputs.infra == 'true'
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"
      - name: Cache OpenTofu providers
        if: steps.changes.outputs.infra == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: >-
            opentofu-providers-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('infra/opentofu/env/prod/.terraform.lock.hcl') }}
      - name: Warm provider cache
        if: steps.changes.outputs.infra == 'true'
        timeout-minutes: 5
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tofu-warm
        run: >-
          timeout --signal=INT --kill-after=15s 240
          tofu -chdir=infra/opentofu/env/prod init -backend=false -input=false -lockfile=readonly
      - name: Install dependencies
        if: steps.changes.outputs.infra == 'true'
        run: uv sync --locked --all-packages
      - name: OpenTofu runner contract
        if: steps.changes.outputs.infra == 'true'
        run: >-
          timeout --signal=INT --kill-after=15s 120
          uv run --no-build pytest -q tests/scripts/test_ci_opentofu_runner.py
      # The processing runtime and origins tests refuse to import modules that this checkout
      # does not bind by source root and sha256; the producer lives next to those tests.
      - name: Bind processing sources
        if: steps.changes.outputs.infra == 'true'
        env:
          PROCESSING_SOURCE_BINDINGS: ${{ runner.temp }}/processing-source-bindings.json
        run: >-
          python -I tests/production/infra/bind_processing_sources.py
          "${PROCESSING_SOURCE_BINDINGS}"
      - name: Run OpenTofu native suite
        if: steps.changes.outputs.infra == 'true'
        id: native-suite
        timeout-minutes: 32
        env:
          PROCESSING_SOURCE_BINDINGS: ${{ runner.temp }}/processing-source-bindings.json
        run: >-
          timeout --signal=INT --kill-after=15s 1800
          uv run --no-build pytest -q tests/production/infra --junitxml=infra-native.xml
      - name: Upload JUnit report
        if: always() && steps.changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: infra-native-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra-native.xml
          if-no-files-found: warn
      - name: Validate native report
        if: steps.changes.outputs.infra == 'true'
        run: |
          python -c "import runpy; from pathlib import Path; \
          runpy.run_path('tests/production/test_runtime_acceptance.py')\
          ['require_complete_junit'](Path('infra-native.xml'))"

  opentofu-floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect infrastructure changes
        id: changes
        timeout-minutes: 2
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          infra=true
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            infra=false
            patterns=(
              'infra/**'
              'policies/**'
              'schemas/**'
              'tests/fixtures/**'
              'tests/production/infra/**'
              'tests/production/test_runtime_acceptance.py'
              'tests/scripts/test_ci_opentofu_runner.py'
              'tests/integration/aws_capability/_fargate_mirror.py'
              'tests/integration/aws_capability/_matrix_policies.py'
              'apps/data_processor/Dockerfile'
              'apps/data_processor/src/**'
              'apps/web_dashboard/src/auth/oidcSettings.ts'
              'apps/web_dashboard/src/lib/env.ts'
              'packages/cnes_contracts/**'
              'packages/cnes_domain/**'
              'packages/cnes_*/**'
              '!packages/*/tests/**'
              'packages/cnes_runtime/tests/aws/production_values.py'
              'packages/cnes_control_plane/tests/fixtures/step_functions/**'
              'docs/development.md'
              'docs/runbooks/athena-operator.md'
              'docs/superpowers/specs/2026-11-01-athena-observability-cost-amendment.md'
              'conftest.py'
              'pyproject.toml'
              'pytest.ini'
              'uv.lock'
              '.gitignore'
              '.github/CODEOWNERS'
              '.github/workflows/deploy-main.yml'
              '.github/workflows/infra-native.yml'
            )
            while IFS= read -r -d '' changed; do
              matched=false
              for pattern in "${patterns[@]}"; do
                # shellcheck disable=SC2053
                if [[ ${pattern} == '!'* && ${changed} == ${pattern:1} ]]; then
                  matched=false
                elif [[ ${changed} == ${pattern} ]]; then
                  matched=true
                fi
              done
              if [[ ${matched} = true ]]; then infra=true; fi
            done < <(git diff -z --no-renames --name-only HEAD^1 HEAD)
          fi
          echo "infra=${infra}" >> "${GITHUB_OUTPUT}"
      # v1.0.8
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        if: steps.changes.outputs.infra == 'true'
        with:
          tofu_version: "1.10.0"
          tofu_wrapper: false
      - name: Format check
        if: steps.changes.outputs.infra == 'true'
        timeout-minutes: 2
        run: tofu -chdir=infra/opentofu fmt -check -recursive
      - name: Init
        if: steps.changes.outputs.infra == 'true'
        timeout-minutes: 5
        run: >-
          timeout --signal=INT --kill-after=15s 240
          tofu -chdir=infra/opentofu/env/prod init -backend=false -input=false -lockfile=readonly
      - name: Validate
        if: steps.changes.outputs.infra == 'true'
        timeout-minutes: 5
        run: >-
          timeout --signal=INT --kill-after=15s 240
          tofu -chdir=infra/opentofu/env/prod validate
