name: stripe-billing-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: stripe-billing-e2e
  cancel-in-progress: false

jobs:
  stripe-billing-e2e:
    if: github.repository == 'VINIClUS/CnesData'
    runs-on: ubuntu-latest
    environment: stripe-sandbox
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"
      - run: uv sync --locked --all-packages
      - name: Start DynamoDB Local
        run: docker compose --profile aws-test up -d --wait dynamodb-local
      - name: Install Stripe CLI
        env:
          STRIPE_CLI_VERSION: 1.53.0
        run: |
          set -euo pipefail
          release="https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}"
          archive="stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          workdir="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${workdir}/${archive}" "${release}/${archive}"
          curl -fsSL --retry 3 -o "${workdir}/checksums.txt" "${release}/stripe-linux-checksums.txt"
          grep -F "  ${archive}" "${workdir}/checksums.txt" > "${workdir}/expected.txt"
          (cd "${workdir}" && sha256sum --check --strict expected.txt)
          tar -xzf "${workdir}/${archive}" -C "${workdir}" stripe
          sudo install -m 0755 "${workdir}/stripe" /usr/local/bin/stripe
          stripe version
      - name: Run Stripe billing E2E
        env:
          RUN_STRIPE_E2E: "1"
          STRIPE_E2E_DELIVERY: cli
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DYNAMODB_ENDPOINT_URL: http://127.0.0.1:18000
        run: uv run pytest tests/e2e/billing -m stripe -v --maxfail=1 --junitxml=stripe-billing-e2e-junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-billing-e2e-junit
          path: stripe-billing-e2e-junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop DynamoDB Local
        if: always()
        run: docker compose --profile aws-test down -v
