name: Trivy

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy fs scan (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,license'
          format: 'sarif'
          output: 'trivy-deps.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: '.worktrees,.venv,node_modules,apps/web_dashboard/node_modules'
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-deps.sarif'
          category: 'trivy-dependencies'

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan (Dockerfiles, compose, Helm)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-dirs: '.worktrees,.venv,node_modules'
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - central_api
          - data_processor
          - cnes_db_migrator
          - web_dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image (local, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cnesdata/${{ matrix.app }}:trivy-scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'cnesdata/${{ matrix.app }}:trivy-scan'
          format: 'sarif'
          output: 'trivy-image-${{ matrix.app }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always() && hashFiles(format('trivy-image-{0}.sarif', matrix.app)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image-${{ matrix.app }}.sarif'
          category: 'trivy-image-${{ matrix.app }}'
