# Artifact interface v1 for PROD-DELIVERY-002; this workflow is the producer authority.
# Select a successful push run on develop by exact head_sha, run.id and run.attempt.
# Download artifacts from that run only; never use deploy-* images or rebuild a candidate.
# Names are stable; all paths below are relative to each downloaded artifact root.
# production-oci-<central_api|data_processor>: image.tar (docker save, linux/amd64),
# image.id (local Docker identity), sbom.cdx.json (CycloneDX), scan.json,
# source.sha, run.id, run.attempt, SHA256SUMS (all payload files, sha256sum -c).
# production-published-<app> (push/develop only): manifest.json with schema_version=1,
# source_sha, run_id, run_attempt, image, digest (registry manifest sha256), config_digest,
# image_archive_sha256, sbom_sha256; plus manifest.sha256. Registry tags are transport only.
# Consumers match config_digest to scan.json.Metadata.ImageID, hashes to the OCI artifact,
# and use image@digest. image.id binds the loaded local image; it can be a manifest digest.
# production-dashboard: dist.tar (dist contents at archive root), source.sha, run.id,
# run.attempt, SHA256SUMS. This is the exact production build exercised by the dist gate.
# production-config: config.tar preserves repo-relative deploy/compose.production.yaml,
# deploy/aws/config, uv.lock, apps/web_dashboard/bun.lock,
# infra/opentofu/env/prod/.terraform.lock.hcl, infra/opentofu/modules/observability/cost-manifest.json,
# policies and schemas/cost-manifest.schema.json.
# source.sha, run.id, run.attempt, SHA256SUMS identify that archive. No rendered env or secret.
# Verify every SHA256SUMS/manifest.sha256 before consumption. Retention: 30 days; expired
# artifacts require a new successful verification run, never reconstruction from mutable tags.
# Delivery tests live here for all subsequent tasks. production-runtime explicitly ignores
# tests/production/delivery; its required aggregator and complete-JUnit policy stay intact.
# Only test_dist_* tests need a compiled dashboard; all other delivery tests run in delivery-contracts.
# Policy authority stays in tests/production/infra; runtime/client authority stays in
# production-runtime.yml. OCI scans reuse trivy.yml severity/ignores, without SARIF credentials.
name: verify-production

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: verify-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  BILLING_MODE: disabled
  DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
  COD_MUN_IBGE: "354130"
  ID_MUNICIPIO_IBGE7: "3541308"
  CNPJ_MANTENEDORA: "55293427000117"
  COMPETENCIA_ANO: "2026"
  COMPETENCIA_MES: "1"

jobs:
  delivery-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.26"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          release="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "${archive}" \
            "${release}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint-bin" actionlint
          echo "${RUNNER_TEMP}/actionlint-bin" >> "${GITHUB_PATH}"
      - run: uv sync --locked --all-packages
      - name: Delivery contracts and CND/AWS runtime boundaries
        run: |
          uv run --no-build pytest -q tests/production/delivery -k 'not test_dist_' \
            --junitxml=delivery.xml
          uv run --no-build python -c "import runpy; from pathlib import Path; \
          runpy.run_path('tests/production/test_runtime_acceptance.py')\
          ['require_complete_junit'](Path('delivery.xml'))"
          uv run --no-build pytest -q tests/production/test_dependency_gate.py \
            tests/production/test_compose_contract.py tests/production/test_compose_runtime_env.py

  dashboard:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
    timeout-minutes: 15
    env:
      VITE_RUNTIME_POLICY: production
      VITE_API_BASE_URL: https://api.cnesdata.com.br/api/v1
      VITE_AUTH_MODE: oidc
      PRODUCTION_DIST: apps/web_dashboard/dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.26"
      - name: Install unzip for setup-bun
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
      - run: uv sync --locked --only-dev --managed-python --python 3.13
      - run: bun install --frozen-lockfile
        working-directory: apps/web_dashboard
      - name: Build production dashboard
        working-directory: apps/web_dashboard
        run: |
          bun run codegen
          bun run build --minify false
          bunx --no-install playwright --version
      - name: Exercise compiled production client at HTTP boundary
        run: |
          uv run --no-sync --no-build pytest -q tests/production/delivery/test_ci_workflows.py -k test_dist_ \
            --junitxml=dashboard-dist.xml
          uv run --no-sync --no-build python -c "import runpy; from pathlib import Path; \
          runpy.run_path('tests/production/test_runtime_acceptance.py')\
          ['require_complete_junit'](Path('dashboard-dist.xml'))"
      - name: Package verified dashboard
        run: |
          mkdir -p dashboard-artifact
          tar -cf dashboard-artifact/dist.tar -C apps/web_dashboard/dist .
          cd dashboard-artifact
          printf '%s\n' "$GITHUB_SHA" > source.sha
          printf '%s\n' "$GITHUB_RUN_ID" > run.id
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > run.attempt
          sha256sum dist.tar source.sha run.id run.attempt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-dashboard
          path: dashboard-artifact/
          if-no-files-found: error
          retention-days: 30

  oci-build:
    name: oci-build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [central_api, data_processor]
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          release="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          curl -fsSL --retry 3 -o "${archive}" \
            "${release}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: cnesdata/${{ matrix.app }}:production-verified
          build-args: OS_PATCH_LEVEL=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save, inventory and scan exact image bytes
        run: |
          set -euo pipefail
          mkdir -p oci-artifact
          docker save --output image.tar "cnesdata/${APP}:production-verified"
          docker image inspect --format '{{.Id}}' "cnesdata/${APP}:production-verified" > image.id
          trivy image --input image.tar --format cyclonedx --output sbom.cdx.json
          trivy image --input image.tar --scanners vuln \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore --format json --output scan.json
          mv image.tar image.id sbom.cdx.json scan.json oci-artifact/
          cd oci-artifact
          printf '%s\n' "$GITHUB_SHA" > source.sha
          printf '%s\n' "$GITHUB_RUN_ID" > run.id
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > run.attempt
          sha256sum image.tar image.id sbom.cdx.json scan.json source.sha run.id run.attempt \
            > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-oci-${{ matrix.app }}
          path: oci-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  opentofu-policy-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.26"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false
      - name: Install native policy tools
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          CONFTEST_VERSION: "0.71.1"
          CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/policy-bin"
          release="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/trivy.tar.gz" \
            "${release}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/policy-bin" trivy
          release="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/conftest.tar.gz" \
            "${release}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  ${RUNNER_TEMP}/conftest.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/conftest.tar.gz" -C "${RUNNER_TEMP}/policy-bin" conftest
          echo "${RUNNER_TEMP}/policy-bin" >> "${GITHUB_PATH}"
      - run: uv sync --locked --all-packages
      - name: Validate readonly locks, native policies and reviewed manifests
        env:
          PROCESSING_SOURCE_BINDINGS: ${{ runner.temp }}/processing-source-bindings.json
        run: |
          set -euo pipefail
          tofu -chdir=infra/opentofu fmt -check -recursive
          tofu -chdir=infra/opentofu/env/prod init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/opentofu/env/prod validate
          uv run --no-build python -I tests/production/infra/bind_processing_sources.py \
            "${PROCESSING_SOURCE_BINDINGS}"
          uv run --no-build pytest -q tests/production/infra/test_opa_policy.py \
            tests/production/infra/test_acceptance.py tests/production/infra/test_cost_manifest.py \
            --junitxml=production-policy.xml
          uv run --no-build python -c "import runpy; from pathlib import Path; \
          runpy.run_path('tests/production/test_runtime_acceptance.py')\
          ['require_complete_junit'](Path('production-policy.xml'))"
          trivy config . --severity CRITICAL,HIGH --exit-code 1 --ignorefile .trivyignore.yaml \
            --skip-dirs .git --skip-dirs .venv --skip-dirs node_modules --skip-dirs .superpowers
          trivy fs . --scanners secret --exit-code 1 --skip-dirs .git --skip-dirs .venv \
            --skip-dirs node_modules --skip-dirs .superpowers
      - name: Package validated configuration and locks
        run: |
          mkdir -p config-artifact
          tar -cf config-artifact/config.tar deploy/compose.production.yaml deploy/aws/config \
            uv.lock apps/web_dashboard/bun.lock infra/opentofu/env/prod/.terraform.lock.hcl \
            infra/opentofu/modules/observability/cost-manifest.json policies \
            schemas/cost-manifest.schema.json
          cd config-artifact
          printf '%s\n' "$GITHUB_SHA" > source.sha
          printf '%s\n' "$GITHUB_RUN_ID" > run.id
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > run.attempt
          sha256sum config.tar source.sha run.id run.attempt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-config
          path: config-artifact/
          if-no-files-found: error
          retention-days: 30

  oci-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [oci-build, dashboard, delivery-contracts, opentofu-policy-cost]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [central_api, data_processor]
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-oci-${{ matrix.app }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Load verified bytes and publish digest
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          test "$(cat source.sha)" = "$GITHUB_SHA"
          test "$(cat run.id)" = "$GITHUB_RUN_ID"
          test "$(cat run.attempt)" = "$GITHUB_RUN_ATTEMPT"
          scanned_config="$(jq -er '.Metadata.ImageID' scan.json)"
          [[ "$scanned_config" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker load --input image.tar
          image_id="$(cat image.id)"
          test "$(docker image inspect --format '{{.Id}}' \
            "cnesdata/${APP}:production-verified")" = "$image_id"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${APP}"
          tag="${image}:verified-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "$image_id" "$tag"
          docker push "$tag"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          remote_config="$(docker buildx imagetools inspect "${image}@${digest}" --raw \
            | jq -r '.config.digest')"
          [[ "$remote_config" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'action=verify_oci_identity local_id=%s scanned_config=%s remote_config=%s\n' \
            "$image_id" "$scanned_config" "$remote_config"
          test "$remote_config" = "$scanned_config"
          archive_sha="$(sha256sum image.tar | cut -d ' ' -f 1)"
          sbom_sha="$(sha256sum sbom.cdx.json | cut -d ' ' -f 1)"
          mkdir -p published
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg image "$image" --arg digest "$digest" \
            --arg config "$scanned_config" --arg archive "$archive_sha" --arg sbom "$sbom_sha" \
            '{schema_version:1,source_sha:$sha,run_id:$run,run_attempt:$attempt,image:$image,
              digest:$digest,config_digest:$config,image_archive_sha256:$archive,sbom_sha256:$sbom}' \
            > published/manifest.json
          cd published
          sha256sum manifest.json > manifest.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-published-${{ matrix.app }}
          path: published/
          if-no-files-found: error
          retention-days: 30
