name: SonarQube Cloud

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
      PG_TEST_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
      COMPETENCIA_ANO: "2026"
      COMPETENCIA_MES: "1"
      DISABLE_PANDERA_IMPORT_WARNING: "True"
      COD_MUN_IBGE: "354130"
      ID_MUNICIPIO_IBGE7: "3541308"
      CNPJ_MANTENEDORA: "55293427000117"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cnesdata
          POSTGRES_PASSWORD: cnesdata_test
          POSTGRES_DB: cnesdata_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cnesdata -d cnesdata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"

      - name: Install Python dependencies
        run: uv sync --locked --all-packages

      - name: Run Python gate (emits coverage-*.xml)
        run: bash scripts/ci_python_gate.sh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: apps/dump_agent_go/go.sum

      - name: Go coverage
        working-directory: apps/dump_agent_go
        run: go test -count=1 -coverprofile=coverage.out ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: web_dashboard install + coverage
        working-directory: apps/web_dashboard
        run: |
          bun install --frozen-lockfile
          bun run codegen
          bun run test --coverage

      - uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
