name: SonarQube Cloud

on:
  workflow_dispatch:
    inputs:
      align_primary_branch:
        description: Run the one-time Sonar primary-branch alignment
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# All source and administrative Sonar requests share one non-cancelling lock.
# This prevents an alignment write from racing an analysis already in flight.
concurrency:
  group: sonar-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # A manual source run is valid only for the canonical source branch. This
  # job is intentionally independent of sonar, so a skipped guard cannot hide
  # the normal PR/push check.
  dispatch-ref-guard:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.align_primary_branch != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-canonical manual source ref
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != "refs/heads/develop" ]]; then
            echo "::error::ordinary Sonar dispatch must use refs/heads/develop"
            exit 1
          fi

  # This job is the only workflow path allowed to mutate Sonar project
  # metadata. It never checks out source or runs the scanner.
  sonar-admin:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.align_primary_branch == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Align Sonar primary branch (owner-only, explicit opt-in)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_ALIGN_PRIMARY_BRANCH: ${{ inputs.align_primary_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # SONAR_ADMIN_BEGIN
          """Fail-closed, single-attempt Sonar primary-branch alignment."""

          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request


          PROJECT = "VINIClUS_CnesData"
          CURRENT_PRIMARY = "main"
          TARGET_PRIMARY = "develop"
          SONAR_BASE = "https://sonarcloud.io"
          TRUSTED_REPOSITORY = "VINIClUS/CnesData"
          TRUSTED_REPOSITORY_ID = "1177879951"
          TRUSTED_OWNER_ID = "124298687"
          TRUSTED_ACTOR = "VINIClUS"
          TRUSTED_ACTOR_ID = "124298687"
          TRUSTED_REF = "refs/heads/main"


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, new_url):
                  raise RuntimeError("redirect refused")


          def _fail(message):
              print(f"sonar admin failed closed: {message}", file=sys.stderr)
              raise SystemExit(1)


          def _context_guard():
              expected = {
                  "GITHUB_EVENT_NAME": "workflow_dispatch",
                  "GITHUB_REPOSITORY": TRUSTED_REPOSITORY,
                  "GITHUB_REPOSITORY_ID": TRUSTED_REPOSITORY_ID,
                  "GITHUB_REPOSITORY_OWNER_ID": TRUSTED_OWNER_ID,
                  "GITHUB_ACTOR": TRUSTED_ACTOR,
                  "GITHUB_ACTOR_ID": TRUSTED_ACTOR_ID,
                  "GITHUB_REF": TRUSTED_REF,
                  "INPUT_ALIGN_PRIMARY_BRANCH": "true",
              }
              for key, value in expected.items():
                  if os.environ.get(key) != value:
                      _fail(f"untrusted workflow context ({key})")
              token = os.environ.get("SONAR_TOKEN")
              if not token:
                  _fail("SONAR_TOKEN is unavailable")
              return token


          def _request(token, method, path, form=None):
              body = None
              if form is not None:
                  body = urllib.parse.urlencode(form).encode("ascii")
              request = urllib.request.Request(
                  SONAR_BASE + path,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/json",
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/x-www-form-urlencoded",
                  },
              )
              opener = urllib.request.build_opener(_NoRedirect)
              try:
                  with opener.open(request, timeout=10) as response:
                      payload = response.read(1024 * 1024 + 1)
                      if len(payload) > 1024 * 1024:
                          _fail("Sonar response exceeded the safety bound")
                      return response.status, json.loads(payload)
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      _fail("missing Sonar project Administer permission")
                  _fail("Sonar API rejected the request")
              except Exception:
                  # A lost response after a mutation is ambiguous. Never repeat
                  # or issue a compensating mutation from this process.
                  _fail("Sonar API transport or redirect failure")


          def _branches(token):
              status, payload = _request(
                  token,
                  "GET",
                  "/api/project_branches/list?project="
                  + urllib.parse.quote(PROJECT, safe=""),
              )
              if status != 200 or not isinstance(payload, dict):
                  _fail("unexpected Sonar branch response")
              branches = payload.get("branches")
              if not isinstance(branches, list) or not branches:
                  _fail("unexpected Sonar branch state")
              normalized = []
              for branch in branches:
                  if not isinstance(branch, dict):
                      _fail("unexpected Sonar branch state")
                  if not isinstance(branch.get("name"), str) or not isinstance(
                      branch.get("isMain"), bool
                  ):
                      _fail("unexpected Sonar branch state")
                  normalized.append(branch)
              return normalized


          def _verify_target(branches):
              targets = [branch for branch in branches if branch["name"] == TARGET_PRIMARY]
              if len(targets) != 1 or not targets[0]["isMain"]:
                  _fail("Sonar primary branch readback is not develop")


          def main():
              token = _context_guard()
              branches = _branches(token)
              mains = [branch for branch in branches if branch["isMain"]]
              if len(mains) != 1:
                  _fail("unexpected Sonar primary branch state")
              if mains[0]["name"] == TARGET_PRIMARY:
                  _verify_target(branches)
                  print("Sonar primary branch is already develop")
                  return
              if mains[0]["name"] != CURRENT_PRIMARY:
                  _fail("unexpected Sonar primary branch state")

              secondary_target = [
                  branch for branch in branches if branch["name"] == TARGET_PRIMARY
              ]
              if len(secondary_target) > 1 or (
                  secondary_target and secondary_target[0]["isMain"]
              ):
                  _fail("unexpected Sonar develop branch state")
              if secondary_target:
                  _request(
                      token,
                      "POST",
                      "/api/project_branches/delete",
                      {"project": PROJECT, "branch": TARGET_PRIMARY},
                  )
                  after_delete = _branches(token)
                  after_delete_mains = [
                      branch for branch in after_delete if branch["isMain"]
                  ]
                  if (
                      len(after_delete_mains) != 1
                      or after_delete_mains[0]["name"] != CURRENT_PRIMARY
                      or any(
                          branch["name"] == TARGET_PRIMARY for branch in after_delete
                      )
                  ):
                      _fail("Sonar delete readback is not the expected state")
              _request(
                  token,
                  "POST",
                  "/api/project_branches/rename",
                  {"project": PROJECT, "name": TARGET_PRIMARY},
              )
              _verify_target(_branches(token))
              print("Sonar primary branch aligned to develop")


          main()
          # SONAR_ADMIN_END
          PY

  sonar:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.align_primary_branch != true && github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
      PG_TEST_URL: postgresql+psycopg://cnesdata:cnesdata_test@localhost:5433/cnesdata_test
      COMPETENCIA_ANO: "2026"
      COMPETENCIA_MES: "1"
      DISABLE_PANDERA_IMPORT_WARNING: "True"
      COD_MUN_IBGE: "354130"
      ID_MUNICIPIO_IBGE7: "3541308"
      CNPJ_MANTENEDORA: "55293427000117"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cnesdata
          POSTGRES_PASSWORD: cnesdata_test
          POSTGRES_DB: cnesdata_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cnesdata -d cnesdata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.9.26"
      - name: Install Python dependencies
        run: uv sync --locked --all-packages
      - name: Run Python gate (emits coverage-*.xml)
        run: bash scripts/ci_python_gate.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: apps/dump_agent_go/go.sum
      - name: Go coverage
        working-directory: apps/dump_agent_go
        run: go test -count=1 -coverprofile=coverage.out ./...
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: web_dashboard install + coverage
        working-directory: apps/web_dashboard
        run: |
          bun install --frozen-lockfile
          bun run codegen
          bun run test --coverage
      - uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
