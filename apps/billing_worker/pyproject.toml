[project]
name = "billing-worker"
version = "0.1.0"
description = "Billing worker — inbox drain and Stripe webhook recovery"
requires-python = ">=3.13"
dependencies = [
    "cnes-domain",
    "cnes-control-plane",
    "cnes-observability",
]

[project.scripts]
billing-worker = "billing_worker.main:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_worker"]

[tool.uv.sources]
cnes-domain = { workspace = true }
cnes-control-plane = { workspace = true }
cnes-observability = { workspace = true }
