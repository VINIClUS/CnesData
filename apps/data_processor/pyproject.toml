[project]
name = "data-processor"
version = "0.1.0"
description = "Server-side worker — downloads Parquet from MinIO, transforms, persists to Gold schema"
requires-python = ">=3.13"
dependencies = [
    "cnes-contracts",
    "cnes-domain",
    "cnes-data[etl]",
    "cnes-control-plane",
    "cnes-governance",
    "cnes-observability",
    "cnes-runtime",
    "httpx>=0.27",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_processor"]

[tool.uv.sources]
cnes-contracts = { workspace = true }
cnes-domain = { workspace = true }
cnes-data = { workspace = true }
cnes-control-plane = { workspace = true }
cnes-governance = { workspace = true }
cnes-observability = { workspace = true }
cnes-runtime = { workspace = true }
