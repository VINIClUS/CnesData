version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - errcheck
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G306
        - G404
    misspell:
      ignore-rules:
        - exponencial
        - persistente
    revive:
      rules:
        - name: exported
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: internal/(auth/store|platform/(dll_unix|paths))\.go
        text: G703
    paths:
      - internal/apiclient/generated\.go
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
