overlay: 1.0.0
info:
  title: OpenAPI 3.1 to 3.0 downgrade for oapi-codegen
  version: 1.0.0
actions:
  - target: $.openapi
    update: "3.0.3"
  - target: $.components.schemas.AgentStatusResponse.properties.agent_version
    remove: true
  - target: $.components.schemas.AgentStatusResponse.properties.last_seen
    remove: true
  - target: $.components.schemas.AgentStatusResponse.properties.machine_id
    remove: true
  - target: $.components.schemas.AgentStatusResponse.properties
    update:
      agent_version:
        type: string
        nullable: true
        title: Agent Version
      last_seen:
        type: string
        nullable: true
        title: Last Seen
      machine_id:
        type: string
        nullable: true
        title: Machine Id
  - target: $.components.schemas
    update:
      FileManifest:
        type: object
        required: [minio_key, fato_subtype, size_bytes, sha256]
        properties:
          minio_key:
            type: string
            pattern: "^[\\w\\-./]+\\.parquet\\.gz$"
          fato_subtype:
            type: string
            enum:
              - CNES_VINCULO
              - SIHD_INTERNACAO
              - SIHD_PROC_AIH
              - BPA_C
              - BPA_I
              - SIA_APA
              - SIA_BPI
              - SIA_BPIHST
              - DIM_SIGTAP
              - DIM_MUNICIPIO
          size_bytes:
            type: integer
            minimum: 1
          sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
      JobRegisterRequest:
        type: object
        required: [job_id, files]
        properties:
          job_id:
            type: string
            format: uuid
          files:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/FileManifest'
          agent_version:
            type: string
            nullable: true
            maxLength: 64
          machine_id:
            type: string
            nullable: true
            maxLength: 128
          sha256:
            type: string
            nullable: true
            pattern: "^[0-9a-f]{64}$"
      UploadUrlRequest:
        type: object
        required: [job_id, tenant_id, source_type, tipo_extracao, competencia, intent]
        properties:
          job_id:
            type: string
            format: uuid
          tenant_id:
            type: string
            maxLength: 64
          source_type:
            type: string
            enum: [CNES_LOCAL, CNES_NACIONAL, SIHD, BPA_MAG, SIA_LOCAL]
          tipo_extracao:
            type: string
            maxLength: 32
          competencia:
            type: string
            format: date
          intent:
            type: string
            maxLength: 64
          agent_version:
            type: string
            nullable: true
            maxLength: 64
          machine_id:
            type: string
            nullable: true
            maxLength: 128
      UploadUrlResponse:
        type: object
        required: [extraction_id, upload_url, minio_key]
        properties:
          extraction_id:
            type: string
            format: uuid
          upload_url:
            type: string
          minio_key:
            type: string
            pattern: "^[\\w\\-./]+\\.parquet\\.gz$"
  - target: $.paths
    update:
      /api/v1/jobs/upload-url:
        post:
          operationId: mint_upload_url_api_v1_jobs_upload_url_post
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UploadUrlRequest'
          responses:
            '201':
              description: Created
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/UploadUrlResponse'
            '409':
              description: Conflict
            '422':
              description: Validation Error
